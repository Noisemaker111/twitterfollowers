<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #1d9bf0;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #1a8cd8;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h2>MyXFollowing Exporter</h2>
  <p>Navigate to your Followers, Following, or Blocked list on X.com and click below.</p>
  <button id="scrapeBtn">Scrape Visible Users</button>
  <button id="downloadBtn" style="background-color: #2f3336; display: none;">Download JSON</button>
  <div id="status" class="status">Ready</div>
  <script src="popup.js"></script>
</body>
</html>
