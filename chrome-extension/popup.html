<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      display: inline-block;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #1d9bf0;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1a8cd8;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>

<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h2>MyXFollowing</h2>
  </div>

  <p style="margin-top: 0;">Navigate to your Followers, Following, or Blocked list on X.com and click below.</p>

  <div style="margin-bottom: 15px;">
    <label for="limitSlider">Scrape Limit: <span id="limitDisplay">50</span></label>
    <input type="range" id="limitSlider" min="10" max="5000" value="50" step="10" style="width: 100%;">
  </div>

  <button id="scrapeBtn">Scrape Users</button>
  <button id="downloadBtn" style="background-color: #2f3336; display: none;">Download JSON</button>
  <div id="status" class="status">Ready</div>

  <script src="popup.js"></script>
</body>

</html>
